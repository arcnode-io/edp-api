template: bess_module
kind: module
description: BESS module aggregation — published rollups + setpoint fanout

contains:
  - template: bess_rack
    qty: scalable

measurements:
  # Rollups project a bess_rack measurement across however many racks this
  # module's contains[] actually resolves to at deployment time — gateway
  # resolves the child list, edp-api just declares the aggregation.
  state_of_charge:
    unit: percent
    type: float
    poll_rate_hz: 1
    display_name_default: "Module State of Charge"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: weighted_mean
      source_measurement: state_of_charge

  active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Active Power"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      source_measurement: active_power

  reactive_power:
    unit: vars
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Reactive Power"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      source_measurement: reactive_power

  # Synthetic headroom measurements — gateway computes from cached MQTT inputs.
  # Envelope limits apply at the connection point, so headroom is referenced to
  # POI net power P_poi (poi_meter.active_power, + = import from grid), not to
  # this module's own power. Placeholders: {site_id} (gateway runtime) and
  # {poi_meter_device_id} (ems-device-api substitutes the single poi_meter-
  # templated device; generation fails if there isn't exactly one).
  # `operating_envelope` is literal — singleton DOE device per site.
  # Import headroom = import_limit − P_poi. Export is −P_poi, so export
  # headroom = export_limit − (−P_poi) = export_limit + P_poi.
  import_headroom:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "POI Import Headroom"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: subtract
      inputs:
        - sites/{site_id}/devices/operating_envelope/measurements/import_limit/watts
        - sites/{site_id}/devices/{poi_meter_device_id}/measurements/active_power/watts

  export_headroom:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "POI Export Headroom"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      inputs:
        - sites/{site_id}/devices/operating_envelope/measurements/export_limit/watts
        - sites/{site_id}/devices/{poi_meter_device_id}/measurements/active_power/watts

commands:
  # soc_weighted (not equal_split): consistent with state_of_charge's own
  # weighted_mean rollup above — an equal split would ignore per-rack SOC
  # and let racks diverge instead of balancing them via dispatch.
  # ramp_rate_per_sec/hysteresis_margin/hysteresis_dwell_secs are the
  # control-law defaults from handoff-envelope-control-law-RESPONSE-
  # 2026-09-18.md — engineering judgment pending real IEEE 1547 numbers.
  set_active_power:
    verb: set
    target: active_power
    unit: watts
    payload: float
    display_name_default: "Set Active Power"
    binding:
      protocol: distribute
      allocation_policy: soc_weighted
      ramp_rate_per_sec: 0.10
      hysteresis_margin: 0.05
      hysteresis_dwell_secs: 30.0

  set_reactive_power:
    verb: set
    target: reactive_power
    unit: vars
    payload: float
    fanout: local_process

install_tasks:
  - name: container_set_and_anchor
    est_minutes: 360
    crew_role: general
    cx_level: L1
  - name: container_grounding
    depends_on: [container_set_and_anchor]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
