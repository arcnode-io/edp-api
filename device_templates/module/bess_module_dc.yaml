template: bess_module_dc
kind: module
description: DC battery (CATL) module with the PCS on its pad — bank SoC and POI headroom

# One CATL leaf is the whole bank (unverified BMS map, see bess_catl), so
# the module's SoC is that leaf's. Every PCS draws from this one battery;
# dispatch (equal_split to the PCS, sharing this SoC) waits on device-api's
# distribute contract naming its SoC source. The POI headroom measurements
# don't depend on the battery and stay available for envelope compliance.

contains:
  - template: bess_catl
    qty: scalable
  # ARCNODE's PCS sits on the battery pad, one per grid container (ADR-022)
  - template: pcs
    qty: scalable

measurements:
  state_of_charge:
    unit: percent
    type: float
    poll_rate_hz: 1
    display_name_default: "Module State of Charge"
    bounds: { min: 0, max: 100, nominal: 50 }
    publisher: gateway
    binding:
      protocol: synthetic
      operation: weighted_mean
      source_measurement: state_of_charge
      child_template: bess_catl

  # Synthetic headroom measurements — gateway computes from cached MQTT inputs.
  # Envelope limits apply at the connection point, so headroom is referenced to
  # POI net power P_poi (poi_meter.active_power, + = import from grid), not to
  # this module's own power. Placeholders: {site_id} (gateway runtime) and
  # {poi_meter_device_id} (ems-device-api substitutes the single poi_meter-
  # templated device; generation fails if there isn't exactly one).
  # `operating_envelope` is literal — singleton DOE device per site.
  # Import headroom = import_limit − P_poi. Export is −P_poi, so export
  # headroom = export_limit − (−P_poi) = export_limit + P_poi.
  import_headroom:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "POI Import Headroom"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: subtract
      inputs:
        - sites/{site_id}/devices/operating_envelope/measurements/import_limit/watts
        - sites/{site_id}/devices/{poi_meter_device_id}/measurements/active_power/watts

  export_headroom:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "POI Export Headroom"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      inputs:
        - sites/{site_id}/devices/operating_envelope/measurements/export_limit/watts
        - sites/{site_id}/devices/{poi_meter_device_id}/measurements/active_power/watts

# No install tasks: the customer sets and ties in the battery (ADR-001);
# ARCNODE's interface steps are on the bess_catl leaf.
