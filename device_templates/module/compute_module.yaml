template: compute_module
kind: module
description: Compute container aggregation — utilization rollups

contains:
  # PDUs are the power source for everything else in the module — feed from
  # the grid container's LV bus per ADR-005 (415Y/240V). 4× per compute
  # container in 2N redundancy. PDU itself draws no `power_from` — its
  # upstream feed comes from the grid container, modeled at v2.
  - template: pdu
    qty: scalable
  # AC consumers in the module each get power from a PDU. v1 emits one
  # power-cable row per consumer (primary feed); redundant-feed (B-side
  # PDU) is reserved for v2 when PDU instances carry A/B-side designators.
  - template: gpu_node
    qty: scalable
    power_from: [pdu]
  - template: cdu
    qty: 1
    power_from: [pdu]
  - template: network_switch
    qty: scalable
    power_from: [pdu]

measurements:
  total_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Total Power"
    publisher: gateway
    # PDUs feed every load in the container, so their input is the module total.
    binding:
      protocol: synthetic
      operation: sum
      source_measurement: input_power
      child_template: pdu

  total_thermal_load:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Thermal Load"
    publisher: local_process

  pue:
    unit: none
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Power Usage Effectiveness"
    publisher: analyst

commands:
  # Every GPU gets the same percent of its max cap; the gateway sets it when
  # sizing_params.compute_shed_enabled, or an operator sets it by hand.
  set_power_limit:
    verb: set
    target: power_limit
    unit: percent
    payload: float
    display_name_default: "Set GPU Power Limit"
    binding:
      protocol: power_cap
      child_template: gpu_node
      ramp_rate_per_sec: 0.10
      hysteresis_margin: 0.05
      hysteresis_dwell_secs: 30.0
      child_commands:
        - set_gpu_1_power_limit
        - set_gpu_2_power_limit
        - set_gpu_3_power_limit
        - set_gpu_4_power_limit
        - set_gpu_5_power_limit
        - set_gpu_6_power_limit
        - set_gpu_7_power_limit
        - set_gpu_8_power_limit

install_tasks:
  - name: container_set_and_anchor
    est_minutes: 240
    crew_role: general
    cx_level: L1
  - name: container_grounding
    depends_on: [container_set_and_anchor]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
