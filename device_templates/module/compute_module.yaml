template: compute_module
kind: module
description: Compute container aggregation — utilization rollups

contains:
  # The panelboard takes the grid container's LV feeder (ADR-017) and feeds
  # the PDUs, the CDU and the dry cooler. 6 PDUs per compute container,
  # A/B dual-path, 3 per path (ADR-005).
  - template: panelboard
    qty: 1
  - template: rack
    qty: 1
  - template: pdu
    qty: scalable
    power_from: [panelboard]
  # AC consumers in the module each get power from a PDU. v1 emits one
  # power-cable row per consumer (primary feed); redundant-feed (B-side
  # PDU) is reserved for v2 when PDU instances carry A/B-side designators.
  - template: gpu_node
    qty: scalable
    power_from: [pdu]
  - template: cdu
    qty: 1
    power_from: [pdu]
  - template: network_switch
    qty: scalable
    power_from: [pdu]
  - template: mgmt_switch
    qty: 1
    power_from: [pdu]
  # Outdoor dry cooler: own branch on the panelboard
  - template: dc_external
    qty: scalable
    power_from: [panelboard]
  - template: dc_external_dod
    qty: scalable
    power_from: [panelboard]

measurements:
  total_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Total Power"
    # CG feeder: 175 A at 415 V = 125.8 kVA, 80% continuous = 100.6 kW (ADR-017);
    # nominal is the sizing figure (sizing_internals.CONTAINER_KW)
    bounds: { min: 0, max: 125800, nominal: 80000 }
    thresholds: { warn_min: 0, warn_max: 100600, alarm_min: 0, alarm_max: 125800 }
    publisher: gateway
    # PDUs feed every load in the container, so their input is the module total.
    binding:
      protocol: synthetic
      operation: sum
      source_measurement: input_power
      child_template: pdu

  total_thermal_load:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Module Thermal Load"
    publisher: local_process

  pue:
    unit: none
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Power Usage Effectiveness"
    publisher: analyst

commands:
  # Every GPU gets the same percent of its max cap; the gateway sets it when
  # sizing_params.compute_shed_enabled, or an operator sets it by hand.
  set_power_limit:
    verb: set
    target: power_limit
    unit: percent
    payload: float
    display_name_default: "Set GPU Power Limit"
    binding:
      protocol: power_cap
      child_template: gpu_node
      ramp_rate_per_sec: 0.10
      hysteresis_margin: 0.05
      hysteresis_dwell_secs: 30.0
      child_commands:
        - set_gpu_1_power_limit
        - set_gpu_2_power_limit
        - set_gpu_3_power_limit
        - set_gpu_4_power_limit
        - set_gpu_5_power_limit
        - set_gpu_6_power_limit
        - set_gpu_7_power_limit
        - set_gpu_8_power_limit

install_tasks:
  - name: container_set_and_anchor
    est_minutes: 240
    crew_role: general
    cx_level: L1
  - name: container_grounding
    depends_on: [container_set_and_anchor]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
