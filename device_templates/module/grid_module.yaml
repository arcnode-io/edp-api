template: grid_module
kind: module
description: Grid container aggregation — interconnect rollups

contains:
  - template: switchgear
    qty: 1
  - template: transformer
    qty: 1
  - template: lv_switchboard
    qty: 1
  - template: grid_mgmt_switch
    qty: 1
  - template: poi_meter
    qty: 1
  - template: protective_relay
    qty: 1
  - template: pv_inverter
    qty: scalable

measurements:
  net_active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Net Active Power"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      source_measurement: active_power
      child_template: poi_meter

  grid_frequency:
    unit: hertz
    type: float
    poll_rate_hz: 10
    display_name_default: "Grid Frequency"
    # Same bands as bess_rack.frequency
    bounds: { min: 55.0, max: 65.0, nominal: 60.0 }
    thresholds: { warn_min: 59.5, warn_max: 60.5, alarm_min: 59.0, alarm_max: 61.0 }
    publisher: gateway
    binding:
      protocol: synthetic
      operation: mean
      source_measurement: frequency
      child_template: poi_meter

  interconnect_state:
    unit: none
    type: enum
    poll_rate_hz: 0.5
    values: { 0: OPEN, 1: CLOSED, 2: TRIPPED }
    publisher: local_process

install_tasks:
  - name: container_set_and_anchor
    est_minutes: 240
    crew_role: general
    cx_level: L1
  - name: container_grounding
    depends_on: [container_set_and_anchor]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
