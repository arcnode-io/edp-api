template: grid_module
kind: module
description: Grid container aggregation — interconnect rollups

contains:
  - template: switchgear
    qty: 1
  - template: revenue_meter
    qty: 1
  - template: protective_relay
    qty: 1

measurements:
  net_active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Net Active Power"
    publisher: line_controller

  grid_frequency:
    unit: hertz
    type: float
    poll_rate_hz: 10
    display_name_default: "Grid Frequency"
    publisher: line_controller

  interconnect_state:
    unit: none
    type: enum
    poll_rate_hz: 0.5
    values: { 0: OPEN, 1: CLOSED, 2: TRIPPED }
    publisher: line_controller

install_tasks:
  - name: container_set_and_anchor
    est_minutes: 240
    crew_role: general
    cx_level: L1
  - name: container_grounding
    depends_on: [container_set_and_anchor]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
