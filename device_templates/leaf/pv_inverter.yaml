template: pv_inverter
kind: leaf
equipment_id: GRD-PVI-001
vendor: Customer-supplied (any SunSpec-compliant inverter)
model: SunSpec Model 103 three-phase inverter
description: >
  Customer's grid-tied PV inverter, read over SunSpec Modbus. Scalable member
  of grid_module — a site typically has 2+ feeding the AC bus.

# SunSpec model 103 (sunspec/models model_103.json). Assumes base 40000 with
# model 103 directly after Common (model 1, 68 registers), the usual layout;
# a device with another model order needs its addresses adjusted.

measurements:
  active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "PV Active Power"
    iec_61850_ref: MMXU.W
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 40084  # W (int16)
      data_type: int16
      word_order: high_low
      scale_factor_address: 40085  # W_SF (sunssf)

install_tasks:
  - name: set_and_anchor
    est_minutes: 90
    crew_role: electrician
    cx_level: L1
  - name: wire_dc_pv_input
    depends_on: [set_and_anchor]
    est_minutes: 120
    crew_role: electrician
    cx_level: L2
  - name: modbus_commission
    depends_on: [wire_dc_pv_input]
    est_minutes: 20
    crew_role: it
    cx_level: L3
