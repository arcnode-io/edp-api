template: protective_relay
kind: leaf
equipment_id: GRD-RLY-001
vendor: Schweitzer Engineering Laboratories (SEL)
model: SEL-351-7
description: SEL-351-7 feeder protection relay (overcurrent, voltage, frequency, synchrocheck) via DNP3 TCP

# Points from SEL's SEL-351-5/-6/-7 DNP3 device profile (dnpDP-351R100) default
# map. Odd analog indices are angles; only magnitudes are read. BI 24/25 are
# user-settable slots that commissioning configures (configure_dnp_map).

measurements:
  phase_a_current:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase A Current"
    binding:
      protocol: dnp3_tcp
      point_index: 0  # IA, A primary
      point_type: analog_input

  phase_b_current:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase B Current"
    binding:
      protocol: dnp3_tcp
      point_index: 2  # IB
      point_type: analog_input

  phase_c_current:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase C Current"
    binding:
      protocol: dnp3_tcp
      point_index: 4  # IC
      point_type: analog_input

  phase_voltage_a:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase A Voltage"
    binding:
      protocol: dnp3_tcp
      point_index: 8  # VA, kV primary
      point_type: analog_input
      scale: 1000.0

  phase_voltage_b:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase B Voltage"
    binding:
      protocol: dnp3_tcp
      point_index: 10  # VB
      point_type: analog_input
      scale: 1000.0

  phase_voltage_c:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Phase C Voltage"
    binding:
      protocol: dnp3_tcp
      point_index: 12  # VC
      point_type: analog_input
      scale: 1000.0

  breaker_closed:
    unit: none
    type: bool
    poll_rate_hz: 1
    display_name_default: "Breaker Closed"
    binding:
      protocol: dnp3_tcp
      point_index: 0  # 52A, breaker auxiliary contact
      point_type: binary_input

  # Phase-to-neutral inputs: the relay's DNP map has no line-to-line or V1.
  voltage_unbalance_pct:
    unit: percent
    type: float
    poll_rate_hz: 1
    display_name_default: "Voltage Unbalance"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: unbalance
      inputs:
        - sites/{site_id}/devices/{device_id}/measurements/phase_voltage_a/volts
        - sites/{site_id}/devices/{device_id}/measurements/phase_voltage_b/volts
        - sites/{site_id}/devices/{device_id}/measurements/phase_voltage_c/volts

  trip_status:
    unit: none
    type: bool
    poll_rate_hz: 1
    display_name_default: "Trip Status"
    binding:
      protocol: dnp3_tcp
      point_index: 9  # TRIP_LED, trip target
      point_type: binary_input

  ground_fault:
    unit: none
    type: bool
    poll_rate_hz: 1
    display_name_default: "Ground Fault"
    binding:
      protocol: dnp3_tcp
      point_index: 15  # G target
      point_type: binary_input

  anti_islanding_armed:
    unit: none
    type: bool
    poll_rate_hz: 1
    display_name_default: "Anti-Islanding Armed"
    binding:
      protocol: dnp3_tcp
      point_index: 24  # user-settable slot
      point_type: binary_input

  ride_through_enabled:
    unit: none
    type: bool
    poll_rate_hz: 1
    display_name_default: "Ride-Through Enabled"
    binding:
      protocol: dnp3_tcp
      point_index: 25  # user-settable slot
      point_type: binary_input

install_tasks:
  - name: mount_in_panel
    est_minutes: 60
    crew_role: electrician
    cx_level: L1
  - name: wire_ct_pt_inputs
    depends_on: [mount_in_panel]
    est_minutes: 90
    crew_role: electrician
    cx_level: L2
  - name: configure_dnp_map
    depends_on: [wire_ct_pt_inputs]
    est_minutes: 20
    crew_role: it
    cx_level: L3
  - name: dnp3_commission
    depends_on: [configure_dnp_map]
    est_minutes: 30
    crew_role: it
    cx_level: L3
  - name: protection_settings_test
    depends_on: [dnp3_commission]
    est_minutes: 60
    crew_role: electrician
    cx_level: L4
