template: bess_rack
kind: leaf
equipment_id: EXT-BESS-001
vendor: Tesla
model: Megapack 2 XL (PN 1848844-XX-Y)
description: Tesla Megapack 2 XL 4 MWh AC-coupled BESS with grid-forming inverter via Modbus TCP

# Reason: No commercial-ac topology entry for BESS (customer-supplied equipment per ADR-001).
# Register addresses are placeholder (0-based) — actual map is gated by Tesla sales.
# Addresses follow common BESS Modbus conventions; must be verified at commissioning.

measurements:
  state_of_charge:
    unit: percent
    type: float
    poll_rate_hz: 1
    display_name_default: "State of Charge"
    iec_61850_ref: ZBAT.BatChaSt
    bounds: { min: 0, max: 100, nominal: 50 }
    thresholds: { warn_min: 15, warn_max: 90, alarm_min: 5, alarm_max: 95 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 0
      data_type: uint16
      word_order: high_low
      scale: 0.1

  active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Active Power (+ discharge, - charge)"
    iec_61850_ref: MMXU.W
    bounds: { min: -4000000, max: 4000000, nominal: 0 }
    thresholds: { warn_min: -3800000, warn_max: 3800000, alarm_min: -4000000, alarm_max: 4000000 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 10
      data_type: int32
      word_order: high_low
      scale: 1.0

  reactive_power:
    unit: vars
    type: float
    poll_rate_hz: 1
    display_name_default: "Reactive Power"
    iec_61850_ref: MMXU.VAr
    bounds: { min: -2000000, max: 2000000, nominal: 0 }
    thresholds: { warn_min: -1800000, warn_max: 1800000, alarm_min: -2000000, alarm_max: 2000000 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 12
      data_type: int32
      word_order: high_low
      scale: 1.0

  ac_voltage:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "AC Bus Voltage"
    iec_61850_ref: MMXU.PhV.phsA
    bounds: { min: 0, max: 600, nominal: 480 }
    thresholds: { warn_min: 432, warn_max: 528, alarm_min: 408, alarm_max: 552 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 20
      data_type: uint16
      word_order: high_low
      scale: 0.1

  frequency:
    unit: hertz
    type: float
    poll_rate_hz: 10
    display_name_default: "AC Frequency"
    iec_61850_ref: MMXU.Hz
    bounds: { min: 55.0, max: 65.0, nominal: 60.0 }
    thresholds: { warn_min: 59.5, warn_max: 60.5, alarm_min: 59.0, alarm_max: 61.0 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 22
      data_type: uint16
      word_order: high_low
      scale: 0.01

  energy_discharged:
    unit: watt_hours
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Energy Discharged"
    iec_61850_ref: MMTR.SupWh
    bounds: { min: 0, max: 1000000000, nominal: 0 }
    thresholds: { warn_min: 0, warn_max: 950000000, alarm_min: 0, alarm_max: 1000000000 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 30
      data_type: int32
      word_order: high_low
      scale: 1.0

  operating_state:
    unit: none
    type: enum
    poll_rate_hz: 1
    display_name_default: "Operating State"
    iec_61850_ref: ZGEN.Mod.stVal
    values:
      0: STANDBY
      1: CHARGING
      2: DISCHARGING
      3: FAULT
      4: OFFLINE
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 40
      data_type: uint16
      word_order: high_low

commands:
  set_active_power:
    verb: set
    target: active_power
    unit: watts
    payload: float
    display_name_default: "Set Active Power Setpoint"
    binding:
      protocol: modbus_tcp
      function_code: 16
      address: 50
      data_type: int32
      word_order: high_low
      scale: 1.0
