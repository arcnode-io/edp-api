template: dc_external
kind: leaf
equipment_id: EXT-DC-001
vendor: Güntner (Güntner U.S. LLC)
model: GFD Series (V-shape, ECM fans, fluid cooler)
description: Güntner GFD outdoor V-shape dry cooler with EC fan motors via Modbus TCP

# Registers from Güntner "Interface Specification – Modbus GMM V_3.0" (GMM EC
# controller); addresses are on-wire decimal. The GMM is Modbus RTU over RS-485,
# reached through an RS-485/TCP converter. Which sensor sits on AI1/AI2/AI3 is
# set in the GMM service menu at commissioning.

measurements:
  leaving_fluid_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Leaving Fluid Temperature"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53508  # §4.3.5 scaled value AI1
      data_type: int16
      word_order: high_low
      scale: 0.1

  entering_fluid_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Entering Fluid Temperature"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53511  # §4.3.8 scaled value AI2
      data_type: int16
      word_order: high_low
      scale: 0.1

  ambient_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Ambient Air Temperature"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53513  # §4.3.11 scaled value AI3 (GTF210)
      data_type: int16
      word_order: high_low
      scale: 0.1

  fan_1_speed:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Fan 1 Speed"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53633  # §4.3.25 fan speed % of max, fan 1
      data_type: uint16
      word_order: high_low

  fan_2_speed:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Fan 2 Speed"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53634  # §4.3.25 fan 2
      data_type: uint16
      word_order: high_low

  operating_mode:
    unit: none
    type: enum
    poll_rate_hz: 0.5
    display_name_default: "Operating Mode"
    values:
      0: AUTOMATIC_INTERNAL
      1: AUTOMATIC_EXTERNAL_ANALOG
      2: AUTOMATIC_EXTERNAL_BUS
      3: SLAVE_EXTERNAL_ANALOG
      4: SLAVE_EXTERNAL_BUS
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 53249  # §4.2.2
      data_type: uint16
      word_order: high_low

  # §4.3.23 bitfield: b0-b3 AI1-AI4 error, b6 no sensor selected, b14 no EC
  # controller status word, b15 hardware fault.
  fault_word:
    unit: none
    type: float
    poll_rate_hz: 0.5
    display_name_default: "GMM Fault Word"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 53616
      data_type: uint16
      word_order: high_low

commands:
  # §4.2.4.1 Setpoint 1; only drives the GMM in AUTOMATIC_EXTERNAL_BUS mode.
  set_leaving_fluid_temp:
    verb: set
    target: leaving_fluid_temp
    unit: celsius
    payload: float
    display_name_default: "Set Leaving Fluid Temperature Setpoint"
    binding:
      protocol: modbus_tcp
      function_code: 6
      address: 53257
      data_type: uint16
      word_order: high_low
      scale: 0.1

install_tasks:
  - name: utility_interconnect_witness
    est_minutes: 30
    crew_role: general
    cx_level: L1
