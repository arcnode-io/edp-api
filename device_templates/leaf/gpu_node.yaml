      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_3/ProcessorMetrics, json_pointer: /Oem/Nvidia/ThrottleReasons/0,
        value_map: { "NA": NA, "SWPowerCap": SW_POWER_CAP, "HWSlowdown": HW_SLOWDOWN, "HWThermalSlowdown": HW_THERMAL_SLOWDOWN, "HWPowerBrakeSlowdown": HW_POWER_BRAKE_SLOWDOWN, "SyncBoost": SYNC_BOOST, "ClockOptimizedForPower": CLOCK_OPTIMIZED_FOR_POWER, "ClockOptimizedForThermalEngage": CLOCK_OPTIMIZED_FOR_THERMAL_ENGAGE, "Current GPU temperature above the GPU Max Operating Temperature or Current memory temperature above the Memory Max Operating Temperature": GPU_THERMAL_OVERT } } }
