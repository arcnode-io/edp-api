template: gpu_node
kind: leaf
equipment_id: CMP-NODE-001
vendor: Supermicro (Super Micro Computer Inc.)
model: SYS-421GE-NBRT-LCC
description: 4U liquid-cooled HGX B200 GPU server (8× NVIDIA B200 SXM) with Redfish BMC

# Node: Supermicro X13 Redfish (/Chassis/1/Power is deprecated from X14 but
# served on X13). Per GPU: NVIDIA HGX Redfish — EnvironmentMetrics per the DGX
# B200 user guide; ProcessorMetrics (OperatingSpeedMHz, Oem.Nvidia.
# ThrottleReasons) per NVIDIA/bmcweb nvidia_processor.hpp. ThrottleReasons is a
# list (["NA"] when not throttled); index 0 is read, filled in bit order so
# SWPowerCap (power cap) comes first when present.

measurements:
  power_consumed:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Power Consumed"
    binding: { protocol: redfish, uri: /Chassis/1/Power, json_pointer: /PowerControl/0/PowerConsumedWatts }

  power_limit:
    unit: watts
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Power Limit"
    binding: { protocol: redfish, uri: /Chassis/1/Power, json_pointer: /PowerControl/0/PowerLimit/LimitInWatts }

  inlet_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Inlet Temperature"
    binding: { protocol: redfish, uri: /Chassis/1/Sensors/InletTemp, json_pointer: /Reading }

  fan_speed:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Fan Speed"
    binding: { protocol: redfish, uri: /Chassis/1/Thermal, json_pointer: /Fans/0/Reading }

  gpu_power_watts:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "GPU Total Power"
    publisher: gateway
    binding:
      protocol: synthetic
      operation: sum
      inputs:
        - sites/{site_id}/devices/{device_id}/measurements/gpu_1_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_2_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_3_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_4_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_5_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_6_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_7_power/watts
        - sites/{site_id}/devices/{device_id}/measurements/gpu_8_power/watts

  gpu_1_power:
    { unit: watts, type: float, poll_rate_hz: 1, display_name_default: "GPU 1 Power",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_1/EnvironmentMetrics, json_pointer: /PowerWatts/Reading } }
  gpu_1_power_limit:
    { unit: watts, type: float, poll_rate_hz: 0.1, display_name_default: "GPU 1 Power Limit",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_1/EnvironmentMetrics, json_pointer: /PowerLimitWatts/SetPoint } }
  gpu_1_clock:
    { unit: hertz, type: float, poll_rate_hz: 1, display_name_default: "GPU 1 Clock",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_1/ProcessorMetrics, json_pointer: /OperatingSpeedMHz, scale: 1000000.0 } }
  gpu_1_throttle_reason:
    { unit: none, type: enum, poll_rate_hz: 1, display_name_default: "GPU 1 Throttle Reason",
      values: { 0: NA, 1: SW_POWER_CAP, 2: HW_SLOWDOWN, 3: HW_THERMAL_SLOWDOWN, 4: HW_POWER_BRAKE_SLOWDOWN, 5: SYNC_BOOST, 6: CLOCK_OPTIMIZED_FOR_POWER, 7: CLOCK_OPTIMIZED_FOR_THERMAL_ENGAGE, 8: GPU_THERMAL_OVERT },
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_1/ProcessorMetrics, json_pointer: /Oem/Nvidia/ThrottleReasons/0,
        value_map: { "NA": NA, "SWPowerCap": SW_POWER_CAP, "HWSlowdown": HW_SLOWDOWN, "HWThermalSlowdown": HW_THERMAL_SLOWDOWN, "HWPowerBrakeSlowdown": HW_POWER_BRAKE_SLOWDOWN, "SyncBoost": SYNC_BOOST, "ClockOptimizedForPower": CLOCK_OPTIMIZED_FOR_POWER, "ClockOptimizedForThermalEngage": CLOCK_OPTIMIZED_FOR_THERMAL_ENGAGE, "Current GPU temperature above the GPU Max Operating Temperature or Current memory temperature above the Memory Max Operating Temperature": GPU_THERMAL_OVERT } } }
  gpu_2_power:
    { unit: watts, type: float, poll_rate_hz: 1, display_name_default: "GPU 2 Power",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_2/EnvironmentMetrics, json_pointer: /PowerWatts/Reading } }
  gpu_2_power_limit:
    { unit: watts, type: float, poll_rate_hz: 0.1, display_name_default: "GPU 2 Power Limit",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_2/EnvironmentMetrics, json_pointer: /PowerLimitWatts/SetPoint } }
  gpu_2_clock:
    { unit: hertz, type: float, poll_rate_hz: 1, display_name_default: "GPU 2 Clock",
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_2/ProcessorMetrics, json_pointer: /OperatingSpeedMHz, scale: 1000000.0 } }
  gpu_2_throttle_reason:
    { unit: none, type: enum, poll_rate_hz: 1, display_name_default: "GPU 2 Throttle Reason",
      values: { 0: NA, 1: SW_POWER_CAP, 2: HW_SLOWDOWN, 3: HW_THERMAL_SLOWDOWN, 4: HW_POWER_BRAKE_SLOWDOWN, 5: SYNC_BOOST, 6: CLOCK_OPTIMIZED_FOR_POWER, 7: CLOCK_OPTIMIZED_FOR_THERMAL_ENGAGE, 8: GPU_THERMAL_OVERT },
      binding: { protocol: redfish, uri: /Systems/HGX_Baseboard_0/Processors/GPU_SXM_2/ProcessorMetrics, json_pointer: /Oem/Nvidia/ThrottleReasons/0,
        value_map: { "NA": NA, "SWPowerCap": SW_POWER_CAP, "HWSlowdown": HW_SLOWDOWN, "HWThermalSlowdown": HW_THERMAL_SLOWDOWN, "HWPowerBrakeSlowdown": HW_POWER_BRAKE_SLOWDOWN, "SyncBoost": SYNC_BOOST, "ClockOptimizedForPower": CLOCK_OPTIMIZED_FOR_POWER, "ClockOptimizedForThermalEngage": CLOCK_OPTIMIZED_FOR_THERMAL_ENGAGE, "Current GPU temperature above the GPU Max Operating Temperature or Current memory temperature above the Memory Max Operating Temperature": GPU_THERMAL_OVERT } } }
