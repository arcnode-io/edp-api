template: der_dispatch
kind: leaf
equipment_id: GRD-DER-001
vendor: ARCNODE
model: DER Dispatch Intake (IEEE 2030.5 DERControl)
description: >
  Utility/aggregator DER dispatch per IEEE 2030.5 DERControlBase, received over HTTPS by
  ems-der-control-api and republished to MQTT. Singleton per site. IP-native twin of
  operating_envelope (which carries the DNP3/DOE path). Runtime-onboarded via device-api
  POST /topology — not DTM-emitted.

# Reason: target_active_power bounds sized for datacenter-scale POI (1-10 MW).
# Confirm per deployment at commissioning, same as operating_envelope.

measurements:
  target_active_power:
    unit: watts
    type: float
    poll_rate_hz: 0.0033          # event-driven; nominal rate only
    display_name_default: "DER Target Active Power"
    iec_61850_ref: CSIP.opModTargetW
    bounds: { min: -10000000, max: 10000000, nominal: 0 }
    thresholds: { warn_min: -9500000, warn_max: 9500000, alarm_min: -10000000, alarm_max: 10000000 }
    publisher: der_control_api

  event_active:
    unit: none
    type: bool
    poll_rate_hz: 0.0033
    display_name_default: "DER Event Active"
    iec_61850_ref: CSIP.DERControl.EventStatus
    publisher: der_control_api

  # ADR-002 §16 — reflects der-control-api's own DispatchMode (auto/manual)
  # policy, not just the utility's raw status. Register order = enum ordinal
  # order in ems-der-control-api's DerEventState.java — ground truth there.
  # Named der_event_state, not dispatch_state, to avoid colliding with
  # ems-industrial-gateway's own unrelated dispatch_state (a generic
  # per-command execution ack, different topic family, same word).
  der_event_state:
    unit: none
    type: enum
    poll_rate_hz: 0.0033
    display_name_default: "DER Event State"
    values:
      0: IDLE
      1: PENDING
      2: ARMED
      3: ACTIVE
      4: REJECTED
    publisher: der_control_api

  energize_enabled:
    unit: none
    type: bool
    poll_rate_hz: 0.0033
    display_name_default: "DER Energize Permitted"
    iec_61850_ref: CSIP.opModEnergize
    publisher: der_control_api

  # Phase III — sustained non-delivery detection. Orthogonal to der_event_state:
  # a physical delivery shortfall is not a policy/authorization concern.
  dispatch_shortfall:
    unit: none
    type: bool
    poll_rate_hz: 0.0033
    display_name_default: "Dispatch Shortfall"
    publisher: der_control_api

  # Phase III — site-level real delivered power, gateway-computed by summing
  # whatever distribute-parent devices this deployment has (today: bess_module
  # instances; correct at any count, since it walks the resolved topology by
  # structural trait, not a fixed template list — see
  # ems-industrial-gateway/src/der_dispatch.rs). No binding: der_dispatch has
  # no contains: relationship to those devices (siblings, not parent/child),
  # so neither existing synthetic mode fits — inputs is a fixed topic list,
  # source_measurement only projects across a declared parent's children.
  # publisher: local_process, not gateway — GATEWAY's own docstring promises
  # it's always paired with a synthetic binding, which doesn't apply here.
  actual_active_power:
    unit: watts
    type: float
    poll_rate_hz: 1                # matches the gateway's tick cadence
    display_name_default: "DER Actual Active Power"
    bounds: { min: -10000000, max: 10000000, nominal: 0 }
    thresholds: { warn_min: -9500000, warn_max: 9500000, alarm_min: -10000000, alarm_max: 10000000 }
    publisher: local_process

commands:
  approve_dispatch:
    verb: enable
    target: event_active
    unit: none
    payload: bool
    display_name_default: "Approve Dispatch"
    fanout: der_control_api

  reject_dispatch:
    verb: disable
    target: event_active
    unit: none
    payload: bool
    display_name_default: "Reject Dispatch"
    fanout: der_control_api
