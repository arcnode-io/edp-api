template: poi_meter
kind: leaf
equipment_id: GRD-MTR-001
vendor: Schneider Electric
model: PowerLogic ION9000
description: Class 0.1S revenue-grade POI meter (ANSI C12.20 / IEC 62053-22)

# Registers from Schneider's ION9000 Modbus map 004.005.000 (0-based protocol
# addresses). As a Modbus slave the ION9000 answers FC3 only (user manual
# 7EN02-0390, Modbus function codes).

measurements:
  kwh_delivered:
    unit: watt_hours
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Energy Delivered"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 3204  # Active Energy Delivered (Into Load), INT64 Wh
      data_type: int64
      word_order: high_low

  kwh_received:
    unit: watt_hours
    type: float
    poll_rate_hz: 0.1
    display_name_default: "Energy Received"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 3208  # Active Energy Received (Out of Load), INT64 Wh
      data_type: int64
      word_order: high_low

  # POI net power. ION9000 convention: +P = imported/delivered, matching ours.
  # Operating-envelope limits apply here, not at the battery.
  active_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "POI Active Power (+ import, - export)"
    iec_61850_ref: MMXU.W
    bounds: { min: -10000000, max: 10000000, nominal: 0 }
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 3060  # Active Power Total, FLOAT32 W
      data_type: float32
      word_order: high_low

  power_factor:
    unit: none
    type: float
    poll_rate_hz: 1
    display_name_default: "Power Factor"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 3150  # Power Factor Total (signed), FLOAT32
      data_type: float32
      word_order: high_low

  thd_voltage_a:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "THD Voltage Phase A"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 21330  # THD Voltage A-N, FLOAT32 %
      data_type: float32
      word_order: high_low

  thd_voltage_b:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "THD Voltage Phase B"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 21332  # THD Voltage B-N
      data_type: float32
      word_order: high_low

  thd_voltage_c:
    unit: percent
    type: float
    poll_rate_hz: 0.5
    display_name_default: "THD Voltage Phase C"
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 21334  # THD Voltage C-N
      data_type: float32
      word_order: high_low

install_tasks:
  - name: mount_in_panel
    est_minutes: 30
    crew_role: electrician
    cx_level: L1
  - name: wire_ct_pt_inputs
    depends_on: [mount_in_panel]
    est_minutes: 60
    crew_role: electrician
    cx_level: L2
  - name: modbus_commission
    depends_on: [wire_ct_pt_inputs]
    est_minutes: 15
    crew_role: it
    cx_level: L3
