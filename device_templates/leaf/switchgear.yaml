template: switchgear
kind: leaf
equipment_id: GRD-SWG-001
vendor: ABB
model: SafeGear 15kV / 1200A / 50kA (single section, indoor)
description: ABB SafeGear 15kV arc-resistant metal-clad MV switchgear with integrated protective relay

measurements:
  breaker_state:
    unit: none
    type: enum
    poll_rate_hz: 1
    display_name_default: "Breaker State"
    values:
      0: OPEN
      1: CLOSED
      2: TRIPPED
      3: UNKNOWN
    binding:
      protocol: modbus_tcp
      function_code: 3
      address: 0
      data_type: uint16
      word_order: high_low

  bus_voltage_a:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Voltage Phase A"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 100
      data_type: int16
      word_order: high_low
      scale: 0.1

  bus_voltage_b:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Voltage Phase B"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 101
      data_type: int16
      word_order: high_low
      scale: 0.1

  bus_voltage_c:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Voltage Phase C"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 102
      data_type: int16
      word_order: high_low
      scale: 0.1

  bus_current_a:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Current Phase A"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 110
      data_type: int16
      word_order: high_low
      scale: 0.1

  bus_current_b:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Current Phase B"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 111
      data_type: int16
      word_order: high_low
      scale: 0.1

  bus_current_c:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Bus Current Phase C"
    binding:
      protocol: modbus_tcp
      function_code: 4
      address: 112
      data_type: int16
      word_order: high_low
      scale: 0.1

install_tasks:
  - name: set_and_anchor
    est_minutes: 240
    crew_role: electrician
    cx_level: L1
  - name: terminate_incoming_feeder
    depends_on: [set_and_anchor]
    est_minutes: 180
    crew_role: electrician
    cx_level: L2
  - name: modbus_commission
    depends_on: [terminate_incoming_feeder]
    est_minutes: 30
    crew_role: it
    cx_level: L3
