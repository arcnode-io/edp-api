template: pdu
kind: leaf
equipment_id: CMP-PDU-001
vendor: Server Technology (Legrand)
model: PRO3X C3W36RL
description: Server Tech PRO3X 0U vertical intelligent rack PDU (415V 3ph 60A, 36 outlets, Xerus) via SNMP

# OIDs from Server Technology's Sentry4-MIB. Table index is
# unit(1 = master).cord(1).line|phase; -1 means not available.

measurements:
  input_current_l1:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L1"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.4.3.1.3.1.1.1  # st4LineCurrent, hundredth amps
      scale: 0.01

  input_current_l2:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L2"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.4.3.1.3.1.1.2
      scale: 0.01

  input_current_l3:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L3"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.4.3.1.3.1.1.3
      scale: 0.01

  input_voltage_l1:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L1"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.5.3.1.3.1.1.1  # st4PhaseVoltage, tenth volts
      scale: 0.1

  input_voltage_l2:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L2"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.5.3.1.3.1.1.2
      scale: 0.1

  input_voltage_l3:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L3"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.1718.4.1.5.3.1.3.1.1.3
      scale: 0.1

install_tasks:
  - name: mount_in_rack
    est_minutes: 20
    crew_role: electrician
    cx_level: L1
  - name: wire_input_feed
    depends_on: [mount_in_rack]
    est_minutes: 30
    crew_role: electrician
    cx_level: L2
  - name: snmp_commission
    depends_on: [wire_input_feed]
    est_minutes: 15
    crew_role: it
    cx_level: L3
