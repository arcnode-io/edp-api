template: pdu
kind: leaf
equipment_id: CMP-PDU-001
vendor: Raritan (Legrand)
model: PX4-56A8I2R-C8E8F5V2
description: Raritan PX4 2U horizontal intelligent rack PDU (415V Wye 60A, 34.5 kVA, 18 outlets, Xerus) via SNMP

# OIDs from Raritan PDU2-MIB (all Xerus PDUs). Index pduId(1).inletId(1),
# then pole(line) and sensor type: rmsCurrent 1, rmsVoltage 4, activePower 5.
# Raw values divide by 10^inlet(Pole)SensorDecimalDigits, a per-device config
# value. UNVERIFIED: the scales below assume current 3, voltage 0, power 0;
# confirm at commissioning.

measurements:
  input_current_l1:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L1"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.1.1
      scale: 0.001

  input_current_l2:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L2"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.2.1
      scale: 0.001

  input_current_l3:
    unit: amps
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Current L3"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.3.1
      scale: 0.001

  input_voltage_l1:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L1"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.1.4

  input_voltage_l2:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L2"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.2.4

  input_voltage_l3:
    unit: volts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Voltage L3"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.4.1.4.1.1.3.4

  input_power:
    unit: watts
    type: float
    poll_rate_hz: 1
    display_name_default: "Input Power"
    binding:
      protocol: snmp
      oid: 1.3.6.1.4.1.13742.6.5.2.3.1.4.1.1.5  # inlet activePower

install_tasks:
  - name: mount_in_rack
    est_minutes: 20
    crew_role: electrician
    cx_level: L1
  - name: wire_input_feed
    depends_on: [mount_in_rack]
    est_minutes: 30
    crew_role: electrician
    cx_level: L2
  - name: snmp_commission
    depends_on: [wire_input_feed]
    est_minutes: 15
    crew_role: it
    cx_level: L3
