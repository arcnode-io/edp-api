template: network_switch
kind: leaf
equipment_id: CMP-SWITCH-001
vendor: NVIDIA (Mellanox)
model: Spectrum-X SN5600
description: NVIDIA Spectrum-X SN5600 64-port 800GbE ToR switch via SNMP (Cumulus Linux)

# The SN5600 runs Cumulus Linux 5.9+, which supports IF-MIB and
# ENTITY-SENSOR-MIB (NVIDIA "Supported MIBs"); no Redfish is documented.
# UNVERIFIED: the ifIndex of the uplink and the entPhysicalIndex of each
# sensor are device-specific; the indices below are defaults to confirm on a
# real switch. Temperatures assume entPhySensorPrecision 0 (whole °C).

measurements:
  port_link_status:
    unit: none
    type: enum
    poll_rate_hz: 0.5
    display_name_default: "Uplink Port Status"
    values:
      1: UP
      2: DOWN
      3: TESTING
      4: UNKNOWN
      5: DORMANT
      6: NOT_PRESENT
      7: LOWER_LAYER_DOWN
    binding:
      protocol: snmp
      oid: 1.3.6.1.2.1.2.2.1.8.1  # IF-MIB ifOperStatus.<ifIndex>

  inlet_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "Inlet Temperature"
    binding:
      protocol: snmp
      oid: 1.3.6.1.2.1.99.1.1.1.4.1  # ENTITY-SENSOR-MIB entPhySensorValue.<index>

  asic_temp:
    unit: celsius
    type: float
    poll_rate_hz: 0.5
    display_name_default: "ASIC Temperature"
    binding:
      protocol: snmp
      oid: 1.3.6.1.2.1.99.1.1.1.4.2  # entPhySensorValue.<index>

install_tasks:
  - name: rack_install
    est_minutes: 20
    crew_role: it
    cx_level: L1
  - name: uplink_terminate
    depends_on: [rack_install]
    est_minutes: 30
    crew_role: it
    cx_level: L2
  - name: snmp_commission
    depends_on: [uplink_terminate]
    est_minutes: 15
    crew_role: it
    cx_level: L3
