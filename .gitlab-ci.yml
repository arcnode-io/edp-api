stages:
  - check
  - publish
  - deploy
  - mirror

checks:
  stage: check
  script:
    - uv run poe checks
    # Reason: e2e reads real topologies; clone main explicitly (only the
    # topology files) instead of trusting a shared runner's stale sibling dir.
    - export EDP_MODULE_ASSEMBLIES_DIR="$(mktemp -d)/edp-module-assemblies"
    - git clone --quiet --depth 1 --filter=blob:none --sparse https://gitlab.com/arcnode-io/edp-module-assemblies.git "$EDP_MODULE_ASSEMBLIES_DIR"
    - git -C "$EDP_MODULE_ASSEMBLIES_DIR" sparse-checkout set --no-cone '/assemblies/*/*/topology.yaml'
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/edp-api .
    - docker push public.ecr.aws/y1d2j6a8/edp-api

deploy:
  # Production edp-api runs only inside platform.arcnode.io's compose (service
  # edp-api). Re-pull and restart just that service after every publish, the
  # same SSM path platform-api's deploy_platform uses; no SSH. The job fails if
  # the command fails or the container isn't running.
  stage: deploy
  variables:
    AWS_DEFAULT_REGION: us-east-1
  script:
    - |
      INSTANCE=$(aws ec2 describe-instances --filters Name=tag:Name,Values=arcnode-platform Name=instance-state-name,Values=running --query "Reservations[].Instances[].InstanceId" --output text)
      if [ -z "$INSTANCE" ]; then echo "no arcnode-platform instance; nothing to deploy"; exit 0; fi
      COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --comment "edp-api ${CI_COMMIT_SHORT_SHA}" \
        --parameters '{"commands":["set -e","cd /opt/arcnode-platform","docker compose pull --quiet edp-api","docker compose up -d edp-api","sleep 10","docker compose ps --status running --services | grep -qx edp-api","docker image inspect --format {{.RepoDigests}} public.ecr.aws/y1d2j6a8/edp-api:latest"]}' \
        --query Command.CommandId --output text)
      aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE"
      aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --query "{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}" --output json
  only:
    - main

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/edp-api.git
  only:
    - main
